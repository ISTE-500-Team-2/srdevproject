name: Verify sponsor hosting template
on:
  pull_request:
    paths: ['README.md', 'docs/**', 'Dockerfile', 'backend/**', 'frontend/**', 'database/**', 'ddl/**', '.github/workflows/sponsor-hosting.yml']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sponsor-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rehearse isolated production containers without cloud, TLS or email
        run: bash docs/hosting/verify-ci.sh
      - name: Service diagnostics (no environment or key output)
        if: failure()
        run: docker compose --env-file .env.sponsor -f docs/hosting/compose.yml logs --tail=80

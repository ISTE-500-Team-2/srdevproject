name: Team development setup
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  launcher-unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm run test:dev
      - run: npm run dev:email
        id: missing-key
        continue-on-error: true
      - name: Missing key must stop startup
        if: steps.missing-key.outcome != 'failure'
        run: node -e "process.exit(1)"
  launcher-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm run test:dev:smoke
      - name: Stop disposable CI database
        if: always()
        env:
          DEV_DB_PORT: '25434'
          DEV_DB_NAME: arbor_mvc_dev
        run: docker compose -p arbor-team-demo -f compose.dev.yml down

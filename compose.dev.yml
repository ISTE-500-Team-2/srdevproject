# Dedicated launcher databases. No shared VM data or existing Docker demo volumes.
services:
  db:
    image: postgres:16.14-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
    environment:
      POSTGRES_USER: arbor_mvc
      POSTGRES_DB: ${DEV_DB_NAME:?Use npm run dev or npm run dev:email}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${DEV_DB_PORT:?Use the development launcher}:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbor_mvc -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  data:

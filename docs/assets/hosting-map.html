<!doctype html><html lang="en"><meta charset="utf-8"><title>ARBOR architecture</title><body style="margin:0;background:#f6f2e9"><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><style>text{font-family:Arial,sans-serif} .small{font-size:18px;fill:#53675d}.label{font-size:23px;font-weight:700;fill:#193f31}</style><title id="title">How the hosted application fits together</title><desc id="desc">Browsers connect over HTTPS to Caddy, then the application and private database. The application sends confirmation email through Brevo. Physical reader setup is separate.</desc><rect width="1200" height="480" fill="#f6f2e9"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#53675d"/></marker></defs><text x="50" y="60" class="label">ONE SERVER. THREE SERVICES. CLEAR OWNERSHIP.</text><path d="M260 185H323" stroke="#53675d" stroke-width="3" marker-end="url(#arrow)"/><path d="M545 185H608" stroke="#53675d" stroke-width="3" marker-end="url(#arrow)"/><path d="M830 185H893" stroke="#53675d" stroke-width="3" marker-end="url(#arrow)"/><path d="M725 240V315" stroke="#53675d" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="130" width="210" height="110" rx="12" fill="#fff" stroke="#c3cbbf"/><text x="72" y="170" class="label">Members &amp; staff</text><text x="72" y="203" class="small">A browser + HTTPS</text><rect x="335" y="130" width="210" height="110" rx="12" fill="#fff" stroke="#c3cbbf"/><text x="357" y="170" class="label">Secure front door</text><text x="357" y="203" class="small">Caddy · certificates</text><rect x="620" y="130" width="210" height="110" rx="12" fill="#fff" stroke="#c3cbbf"/><text x="642" y="170" class="label">ARBOR app</text><text x="642" y="203" class="small">React + Express</text><rect x="905" y="130" width="245" height="110" rx="12" fill="#fff" stroke="#c3cbbf"/><text x="927" y="170" class="label">Private database</text><text x="927" y="203" class="small">PostgreSQL 16</text><rect x="620" y="330" width="300" height="90" rx="12" fill="#fff" stroke="#c3cbbf"/><text x="642" y="370" class="label">Confirmation email</text><text x="642" y="403" class="small">Brevo · sponsor-owned</text><text x="50" y="300" class="small">Public ports: 80 / 443 only</text><text x="50" y="334" class="small">Database and API ports stay private.</text><text x="50" y="410" class="small">NFC readers: separate credentials, hardware setup and acceptance test.</text></svg></body></html>

# Existing database and object storage are intentionally external/preserved.
services:
  app:
    image: ${ARBOR_RELEASE_IMAGE:?Use an immutable digest}
    restart: unless-stopped
    env_file: ${ARBOR_ENV_FILE:?Supply protected existing application configuration}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      ENABLE_DEMO_LOGIN: 'false'
    ports: ['127.0.0.1:${ARBOR_HTTP_PORT:-8080}:8080']
    networks: [existing]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
networks:
  existing:
    external: true
    name: ${ARBOR_DOCKER_NETWORK:?Existing database/application network}
